{% extends "base.html" %}
{% block title %}Contact - AI-Based Fake News Detection System{% endblock %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm p-4">
            <h2 class="mb-2">Contact &amp; Feedback</h2>
            <p class="text-muted mb-4">Have a question or suggestion about this project? Send us a message below.</p>

            <form method="POST" action="{{ url_for('contact') }}">
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" name="name" maxlength="120"
                           value="{{ name or '' }}" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" maxlength="150"
                           value="{{ email or '' }}" required>
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label">Message</label>
                    <textarea class="form-control" id="message" name="message" rows="5" maxlength="2000" required>{{ message or '' }}</textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">Submit Feedback</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
